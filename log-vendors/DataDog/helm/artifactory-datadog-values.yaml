installerInfo: '{ "productId": "OnPremObservability-Splunk/1.0.1", "features": [ { "featureId": "ArtifactoryVersion/{{ default .Chart.AppVersion .Values.artifactory.image.version }}" }, { "featureId": "{{ if .Values.postgresql.enabled }}postgresql{{ else }}{{ .Values.database.type }}{{ end }}/0.0.0" }, { "featureId": "Platform/{{ default "kubernetes" .Values.installer.platform }}" },  { "featureId": "Channel/OnPremObservability-Splunk-Helm" } ] }'

fluentd:
  dataDogConf: |
    # DATADOG ARTIFACTORY METRICS OUTPUT
    <match jfrog.metrics.**>
      @type jfrog_send_metrics
      target_platform "DATADOG"
      apikey "#{ENV['DATADOG_API_KEY']}"
      url "https://api.#{ENV['DATADOG_API_HOST']}/api/v2/series"
      # ddtags ["instance:test-artifactory", "cluster:GKE"]
    </match>  

    ## DATADOG ARTIFACTORY LOGS OUTPUT
    <label @vendor.ready>
      <match jfrog.**>
        @type datadog
        @id jfrog_artifactory
        api_key "#{ENV['DATADOG_API_KEY']}"
        #optional
        include_tag_key true
        dd_source jfrog_platform
        service jfrog_artifactory
        host "http-intake.logs.#{ENV['DATADOG_API_HOST']}"
        <buffer>
          flush_interval 1s
          # frequency of the buffer flush
          flush_thread_count 5
          # The number of threads to flush/write chunks in parallel
          chunk_limit_records 10
          # The max number of events that each chunks can store in it
        </buffer>
      </match>
    </label>

artifactory:
  configMaps: |
      {{ .Values.fluentd.sharedConf | indent 4 }}
      {{ .Values.fluentd.dataDogConf | indent 6 }}

  customSidecarContainers: |
    - name: "artifactory-fluentd-sidecar"
      image: "releases-pts-observability-fluentd.jfrog.io/fluentd:4.2"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - mountPath: "{{ .Values.artifactory.persistence.mountPath }}"
          name: artifactory-volume
      env:
        - name: JF_PRODUCT_DATA_INTERNAL
          value: {{ .Values.artifactory.persistence.mountPath }}
        - name: JPD_URL
          value: {{ .Values.jfrog.observability.jpd_url }}
        - name: JPD_ADMIN_USERNAME
          value: {{ .Values.jfrog.observability.username }}
        - name: JFROG_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: jfrog-admin-token
              key: token
        - name: COMMON_JPD
          value: {{ .Values.jfrog.observability.common_jpd | quote }}
        - name: DATADOG_API_KEY
          value: {{ .Values.datadog.api_key }}
        - name: DATADOG_API_HOST
          value: {{ .Values.datadog.api_host }}
        - name: FLUENTD_CONF
          value: ../../../etc/fluentd/fluentd.conf
        - name: TARGET_PLATFORM
          value: 'DATADOG'

datadog:
  api_key: DATADOG_API_KEY
  api_host: DATADOG_API_HOST


