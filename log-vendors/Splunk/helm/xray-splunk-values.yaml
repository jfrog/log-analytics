installerInfo: '{ "productId": "OnPremObservability-Splunk/1.0.1", "features": [ { "featureId": "XrayVersion/{{ default .Chart.AppVersion .Values.xray.image.version }}" }, { "featureId": "{{ if .Values.postgresql.enabled }}postgresql{{ else }}{{ .Values.database.type }}{{ end }}/0.0.0" }, { "featureId": "Platform/{{ default "kubernetes" .Values.installer.platform }}" },  { "featureId": "Channel/OnPremObservability-Splunk-Helm" } ] }'

fluentd:
  splunkConf: |
    # SPLUNK XRAY METRICS OUTPUT
    <match jfrog.metrics.**>
      @type splunk_hec
      protocol "#{ENV['SPLUNK_COM_PROTOCOL']}"
      data_type metric
      hec_host "#{ENV['SPLUNK_HEC_HOST']}"
      hec_port "#{ENV['SPLUNK_HEC_PORT']}"
      hec_token "#{ENV['SPLUNK_METRICS_HEC_TOKEN']}"
      flush_interval 5s
      source ${tag}
      index jfrog_splunk_metrics
      metric_name_key metric_name
      metric_value_key value
      insecure_ssl "#{ENV['SPLUNK_INSECURE_SSL']}"
    </match>
    
  # SPLUNK XRAY METRICS OUTPUT
  <match jfrog.metrics.**>
    @type splunk_hec
    protocol "#{ENV['SPLUNK_COM_PROTOCOL']}"
    data_type metric
    hec_host "#{ENV['SPLUNK_HEC_HOST']}"
    hec_port "#{ENV['SPLUNK_HEC_PORT']}"
    hec_token "#{ENV['SPLUNK_METRICS_HEC_TOKEN']}"
    flush_interval 5s
    source ${tag}
    index jfrog_splunk_metrics
    metric_name_key metric_name
    metric_value_key value
    insecure_ssl "#{ENV['SPLUNK_INSECURE_SSL']}"
  </match>

xray:
  configMaps: |
      {{ .Values.fluentd.sharedConf | indent 4 }}
      {{ .Values.fluentd.splunkConf | indent 6 }}

common:
  customSidecarContainers: |
    - name: "xray-platform-fluentd-sidecar"
      image: "{{ .Values.fluentd.imageName }}:{{ .Values.fluentd.imageTag }}"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - mountPath: "{{ .Values.xray.persistence.mountPath }}"
          name: data-volume
      - mountPath: /etc/fluentd
          name: fluentd-conf-volume  
      - mountPath: /etc/fluentd
        name: fluentd-conf-xray-volume 
      env:
        - name: JF_PRODUCT_DATA_INTERNAL
          value: {{ .Values.xray.persistence.mountPath }}
        - name: FLUENTD_CONF
          value: ../../../etc/fluentd/fluentd.conf
        - name: JPD_URL
          value: {{ .Values.jfrog.observability.jpd_url }}
        - name: JPD_ADMIN_USERNAME
          value: {{ .Values.jfrog.observability.username }}
        - name: JFROG_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: jfrog-admin-token
              key: token
        - name: COMMON_JPD
          value: {{ .Values.jfrog.observability.common_jpd | quote }}
        - name: SPLUNK_COM_PROTOCOL
          value: {{ .Values.splunk.com_protocol }}
        - name: SPLUNK_HEC_HOST
          value: {{ .Values.splunk.host }}
        - name: SPLUNK_HEC_PORT
          value: {{ .Values.splunk.port | quote}}
        - name: SPLUNK_METRICS_HEC_TOKEN
          value: {{ .Values.splunk.metrics_token }}
        - name: SPLUNK_HEC_TOKEN
          value: {{ .Values.splunk.logs_token }}
        - name: SPLUNK_INSECURE_SSL
          value: {{ .Values.splunk.insecure_ssl | quote}}
        - name: TARGET_PLATFORM
          value: 'SPLUNK'

splunk:
  host: SPLUNK_HEC_HOST
  port: SPLUNK_HEC_PORT
  logs_token: SPLUNK_HEC_TOKEN
  metrics_token: SPLUNK_METRICS_HEC_TOKEN
  com_protocol: SPLUNK_COM_PROTOCOL
  insecure_ssl: SPLUNK_INSECURE_SSL